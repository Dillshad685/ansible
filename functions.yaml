- name: inbuilt functions
  hosts: local
  connection: local
  become: yes
  vars:
    technologies: linux, shell, ansible #string
    name: "Dillshad"
    course: "DevOps with AWS"
    Duration: "60 months"
    ipaddress: "1999.202.202.202"
    #dictionary==map
    tags: #keyword for map
      Application: Payment
      Environment: devops
    #lists
    listTags:
      - key: Application
        value: Payment
      - key: Environment
        value: dev
  tasks:
    - name: convert string to List
      ansible.builtin.debug:
        msg: "technologies are: {{ technologies | split (',') }}"  #{ linux, shell, ansible}
    - name: covert map to list 
      ansible.builtin.debug:
        msg: "lists are: {{ tags | dict2items }}"  #{ key:application,value:payment}, {keyenviroment: dev}
    - name: convert items to dict
      ansible.builtin.debug:
        msg: "maps are: {{ listTags | items2dict }}" 
    - name: read yaml file and assign to a variable
      ansible.builtin.set_fact:
        student_yaml: "{{ lookup('file', 'student.yaml') | from_yaml }}"
    - name: convert yaml into json
      ansible.builtin.debug:
        msg: "json: {{ student_yaml | to_json }}"
    - name: save the json file
      ansible.builtin.copy:
        dest: ./dillshad.data.json
        content: "{{ student_yaml | to_nice_json }}"
    - name: convert to lower case
      ansible.builtin.debug:
        msg: "{{ name | lower }}"
    - name: convert to upper case
      ansible.builtin.debug:
        msg: "{{ name | upper }}"
    - name: check if IP address is valid or not
      ansible.builtin.debug:
        msg: "{{ ipaddress | ansible.utils.ipv4 }}"
    - name: grep for root
      ansible.builtin.shell: cat /etc/passwd | grep root
      register: command_output
    - name: print the command_output
      ansible.builtin.debug:
        msg: "outputp: {{ command_output }}"
    - name: redirect the output
      ansible.builtin.command: ls -ltr > /tmp/ouput.txt
      register: redirect_output
      #ignore_errors: true
    - name: print redirect o/p
      ansible.builtin.debug:
        msg: "{{ redirect_output }}"
  
